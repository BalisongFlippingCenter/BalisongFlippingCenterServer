name: Deploy Backend to Production

# runs when code is merged to master or directly pushed to master
on:
  push:
    branches:
      - master

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build, Push, and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_BACKEND_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and push image
        env:
          ECR_URL: ${{ vars.AWS_ECR_REPOSITORY_URL }}
        run: |
          docker build --no-cache -t "$ECR_URL:${{ github.sha }}" -t "$ECR_URL:latest" .
          docker push "$ECR_URL:${{ github.sha }}"
          docker push "$ECR_URL:latest"

      - name: Deploy via SSM
        env:
          INSTANCE_ID: ${{ vars.AWS_EC2_INSTANCE_ID }}
          ECR_URL: ${{ vars.AWS_ECR_REPOSITORY_URL }}
        run: |
          set -euo pipefail
          REGISTRY="${ECR_URL%%/*}"
          COMMANDS=$(jq -n --arg registry "$REGISTRY" '[
            "aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin \($registry)",
            "cd /home/ec2-user",
            "docker-compose pull server",
            "docker-compose up -d --no-deps --force-recreate server",
            "docker image prune -af"
          ]')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "{\"commands\":$COMMANDS}" \
            --query "Command.CommandId" --output text)

          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" || true

          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "Status" --output text)
          echo "--- stdout ---"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardOutputContent" --output text
          echo "--- stderr ---"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardErrorContent" --output text

          echo "Deploy status: $STATUS"
          [ "$STATUS" = "Success" ]

      - name: Verify deployment
        run: |
          for i in $(seq 1 30); do
            if curl -fsS https://balisongflippingcenter.com/api/actuator/health; then
              echo "Backend healthy"
              exit 0
            fi
            echo "Not healthy yet, retrying in 10s..."
            sleep 10
          done
          echo "Backend health check failed after deploy"
          exit 1
