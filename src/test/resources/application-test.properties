# Test-profile overrides so the context can start without real secrets or infra.
# Datasource is supplied at runtime by the Testcontainers @ServiceConnection Postgres container.

security.jwt.secret-key=test-secret-key-not-for-production-use-0123456789
aws.s3.region=us-east-1
cloud.aws.s3.bucket=test-bucket
app.cors.allowed-origins=http://localhost:3000
ai.clients.website.key=test-website-key
ai.clients.discord.key=test-discord-key
spring.mail.username=test@example.com
spring.mail.password=test-password
management.health.mail.enabled=false
