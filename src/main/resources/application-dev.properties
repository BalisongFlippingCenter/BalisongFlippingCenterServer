# Logging Properties
logging.threshold.console=error

#MONGO CONFIG
spring.data.mongodb.authentication-database=admin
spring.data.mongodb.username=rootuser
spring.data.mongodb.password=REDACTED_MONGO_PASSWORD
spring.data.mongodb.database=BalisongFlippingCenter
spring.data.mongodb.port=27017
spring.data.mongodb.host=mongodb

#JWT TOKEN CONFIG
security.jwt.secret-key=REDACTED_JWT_SECRET
security.jwt.expiration-time=30000

#AWS S3 Configuration
cloud.aws.credentials.accessKey=REDACTED_AWS_ACCESS_KEY
cloud.aws.credentials.secretKey=REDACTED_AWS_SECRET_KEY
cloud.aws.region.static=us-east-1
cloud.aws.s3.bucket=balisongflippingcenters3storage

#REST API CONFIG
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
management.endpoints.web.exposure.include: *